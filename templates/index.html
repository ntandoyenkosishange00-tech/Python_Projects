<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLOZELA - Home</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 40px;
            background-image: url('static/wall.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            background-attachment: fixed;
        }

        nav {
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            padding: 20px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-bottom: 40px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #b39ddb;
        }

        .content-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .info-card {
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            /* Centers the homepage text */
        }

        h1 {
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            font-size: 36px;
        }

        p {
            font-size: 22px;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            line-height: 1.6;
        }

        /* Style for a modern home page button */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #b39ddb;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #ffffff;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/">HOME</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        
    </nav>

    <div class="content-container">
        <div class="info-card">
            <h1>Welcome to My Workspace</h1>
            <p>Hi, I am Dlozela. I build elegant, functional, and modern web applications from scratch.</p>
            <a href="/about" class="btn">Explore My Work</a>
        </div>
    </div>

</body>

</html>
